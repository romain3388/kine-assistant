const PROXY="/.netlify/functions/claude";
const callClaude=async(sys,user,maxT=1200)=>{
  const r=await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxT,system:sys,messages:[{role:"user",content:user}]})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||"Erreur "+r.status);}
  const d=await r.json();return d.content?.map(b=>b.text||"").join("")||"";
};
const callClaudeVision=async(sys,user,b64,mime)=>{
  try{
    const r=await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system:sys,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:user}]}]})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||"Erreur "+r.status);}
    const d=await r.json();return d.content?.map(b=>b.text||"").join("")||"";
  }catch(e){throw new Error("Vision: "+e.message);}
};
// Compress image before sending to API (max 1200px, quality 0.7)
const toB64=f=>new Promise((res,rej)=>{
  const img=new Image();
  const url=URL.createObjectURL(f);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const MAX=1200;
    let w=img.width,h=img.height;
    if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
    const canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,w,h);
    const data=canvas.toDataURL('image/jpeg',0.75).split(',')[1];
    res(data);
  };
  img.onerror=rej;
  img.src=url;
});

function useVoice(onText){
  const [rec,setRec]=useState(false);const ref=useRef(null);
  const toggle=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Utilisez le micro du clavier iOS : appuyez sur ✨ Extraire puis dictez dans le champ texte.");return;}
    if(rec){ref.current?.stop();setRec(false);return;}
    const r=new SR();r.lang="fr-FR";r.continuous=true;r.interimResults=true;
    let final="";
    r.onresult=e=>{let int="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+" ";else int+=e.results[i][0].transcript;}onText(final+int);};
    r.onerror=()=>{setRec(false);};
    r.onend=()=>setRec(false);r.start();ref.current=r;setRec(true);
  };
  return{rec,toggle};
}

function CoordonneesTab({extracted,setExtracted,setPatientFromOrdo}){
  const [loading,setLoading]=useState(false);
  const [imgSrc,setImgSrc]=useState(null);
  const [m,setM]=useState({nom:"",telephone:"",email:"",medecin:"",emailMedecin:""});
  const [saved,setSaved]=useState(false);
  const fileRef=useRef();
  const handleFile=async file=>{
    if(!file||!file.type.startsWith("image/"))return;
    setImgSrc(URL.createObjectURL(file));setLoading(true);
    try{
      const b64=await toB64(file);
      const raw=await callClaudeVision("Extrais les coordonnées patient. JSON uniquement.","Extrait: {\"nom\":\"\",\"telephone\":\"\",\"email\":\"\",\"medecin\":\"\",\"emailMedecin\":\"\"}",b64,file.type);
      const data=JSON.parse(raw.replace(/```json|```/g,"").trim());
      setExtracted(data);
      setM({nom:data.nom||"",telephone:data.telephone||"",email:data.email||"",medecin:data.medecin||"",emailMedecin:data.emailMedecin||""});
      setPatientFromOrdo({nom:data.nom||"",email:data.email||"",telephone:data.telephone||""});
    }catch(e){alert("Extraction échouée: "+(e.message||"Erreur inconnue"));}
    setLoading(false);
  };
  const save=()=>{setPatientFromOrdo({nom:m.nom,email:m.email,telephone:m.telephone});setSaved(true);setTimeout(()=>setSaved(false),2500);};
  return(
    <div>
      <div className="card">
        <div className="slabel" style={{color:C.accent}}>📷 Photo de votre logiciel patient</div>
        <div style={{background:C.bg,border:"2px dashed #1A2535",borderRadius:12,padding:28,textAlign:"center",cursor:"pointer"}} onClick={()=>fileRef.current.click()}>
          <div style={{fontSize:40,marginBottom:8}}>📱</div>
          <div style={{fontSize:13,color:C.muted}}>Photo de l ecran ou capture d ecran</div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
          {imgSrc&&<img src={imgSrc} alt="logiciel" style={{maxWidth:"100%",maxHeight:200,objectFit:"contain",borderRadius:8,marginTop:14}}/>}
        </div>
        {loading&&<div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,color:C.muted,fontSize:13}}><Spin/>Extraction en cours...</div>}
      </div>
      <div className="card">
        <div className="slabel" style={{color:C.blue}}>📋 Coordonnées du patient</div>
        <div className="g2">
          {[["Nom Prénom","nom","Dupont Jean"],["Téléphone","telephone","06 12 34 56 78"],["Email patient","email","patient@email.com"],["Médecin traitant","medecin","Dr Martin"],["Email médecin","emailMedecin","dr.martin@cabinet.fr"]].map(([l,k,ph])=>(
            <div key={k} className="fg"><label>{l}</label><input placeholder={ph} value={m[k]||""} onChange={e=>setM(p=>({...p,[k]:e.target.value}))}/></div>
          ))}
        </div>
        <div className="row mt3">
          <button className="btn btn-p" onClick={save}>💾 Enregistrer</button>
          {saved&&<span style={{fontSize:12,color:C.accent,fontWeight:700}}>✓ Sauvegardé</span>}
        </div>
      </div>
      {(m.telephone||m.email)&&(
        <div className="card">
          <div className="slabel" style={{color:C.teal}}>⚡ Contact rapide</div>
          <div className="row">
            {m.telephone&&<a href={"tel:"+m.telephone} className="btn btn-b" style={{textDecoration:"none"}}>📞 Appeler</a>}
            {m.telephone&&<a href={"sms:"+m.telephone} className="btn btn-b" style={{textDecoration:"none"}}>💬 SMS</a>}
            {m.email&&<a href={"mailto:"+m.email} className="btn btn-b" style={{textDecoration:"none"}}>✉️ Email</a>}
          </div>
        </div>
      )}
    </div>
  );
}

      try{const raw=await callClaude("Guidelines EBP kiné. JSON: {\"guidelines\":[{\"recommendation\":\"\",\"level\":\"A|B|C\",\"source\":\"\",\"year\":\"\"}]}. Max 3.",`Guidelines: "${patient.motif}"`,400);const d=JSON.parse(raw.replace(/```json|```/g,"").trim());setGuidelines(d.guidelines||[]);}catch{}
    },1500);
  },[patient.motif]);

  const addDocument=async file=>{
    if(!file||!file.type.startsWith("image/"))return;
    const id=Date.now()+Math.random();
    setDocuments(p=>[...p,{id,label:"Document "+(p.length+1),imgSrc:URL.createObjectURL(file),resume:"",loading:true}]);
    try{
      const b64=await toB64(file);
      const raw=await callClaudeVision("Tu es kinésithérapeute. Analyse cette imagerie: 1)Type/région 2)Structures lésées 3)Diagnostic 4)Implications rééducation. Max 8 lignes.","Analyse.",b64,file.type);
      setDocuments(p=>p.map(d=>d.id===id?{...d,resume:raw,loading:false}:d));
    }catch{setDocuments(p=>p.map(d=>d.id===id?{...d,resume:"Analyse échouée.",loading:false}:d));}
  };
  const imagerieResume=documents.filter(d=>d.resume&&!d.loading).map(d=>"["+d.label+"] "+d.resume).join("\n\n");

  const extractVoice=async()=>{
    if(!voiceText.trim()||!artho)return;setVoiceLoading(true);
    try{
      const ampIds=ebp?.amp.map(a=>a.id)||[];
      const ampTemplate=JSON.stringify(Object.fromEntries(ampIds.map(i=>[i,null])));
      const prompt="Dictée clinique à analyser:\n"+voiceText+"\n\nExtrait uniquement ce JSON (valeurs numériques pour EVA 0-10, numériques pour amplitudes):\n{\"douleur\":{\"evaRepos\":null,\"evaMvt\":null,\"evaNuit\":null},\"amplitudesD\":"+ampTemplate+",\"amplitudesG\":"+ampTemplate+",\"forceD\":{},\"forceG\":{},\"type_douleur\":null,\"irradiations\":null,\"notes\":null}";
      const raw=await callClaude("Tu es kinésithérapeute. Extrais les données cliniques du texte dicté. Réponds UNIQUEMENT avec le JSON demandé, sans markdown ni commentaire.",prompt,600);
      const cleaned=raw.replace(/```json/g,"").replace(/```/g,"").trim();
      const d=JSON.parse(cleaned);
      let filled=0;
      if(d.douleur?.evaRepos!=null){setEvaR(Math.min(10,Math.max(0,+d.douleur.evaRepos)));filled++;}
      if(d.douleur?.evaMvt!=null){setEvaMvt(Math.min(10,Math.max(0,+d.douleur.evaMvt)));filled++;}
      if(d.douleur?.evaNuit!=null){setEvaN(Math.min(10,Math.max(0,+d.douleur.evaNuit)));filled++;}
      if(d.type_douleur)setDType(d.type_douleur);
      if(d.irradiations)setIrrad(d.irradiations);
      if(d.amplitudesD){const nd={};Object.entries(d.amplitudesD).forEach(([k,v])=>{if(v!=null&&v!==""){nd[k]=String(v);filled++;}});if(Object.keys(nd).length)setAmplD(p=>({...p,...nd}));}
      if(d.amplitudesG){const ng={};Object.entries(d.amplitudesG).forEach(([k,v])=>{if(v!=null&&v!==""){ng[k]=String(v);filled++;}});if(Object.keys(ng).length)setAmplG(p=>({...p,...ng}));}
      if(d.notes)setExtraNotes(n=>n?n+"\n"+d.notes:d.notes);
      setVoiceText("");
      alert(filled>0?"✅ "+filled+" champ(s) pré-rempli(s) avec succès !":"⚠️ Aucune valeur numérique détectée dans la dictée. Vérifiez que vous avez bien énoncé des chiffres (ex: flexion 100 degrés, EVA 4).");
    }catch(e){
      console.error("Extract error:",e);
      alert("Extraction échouée — "+e.message+"\n\nVérifiez votre connexion internet et réessayez.");
    }
    setVoiceLoading(false);
  };

  const generateBilan=async()=>{
    if(!artho){alert("Sélectionnez une articulation d'abord.");return;}
    setBilanLoading(true);setBilanResult("");
    const positifs=ebp.tests.filter(t=>checkedTests[t.id]);
    const mouvText=mouvD.filter(m=>m.mouvement).map(m=>m.mouvement+": EVA "+m.eva+"/10"+(m.type?" ("+m.type+")":"")).join(" | ")||"non évalué";
    const ampsText=ebp.amp.map(a=>a.l+": ActD="+(amplD[a.id]||"NR")+" PassD="+(amplDp[a.id]||"NR")+" ActG="+(amplG[a.id]||"NR")+" PassG="+(amplGp[a.id]||"NR")).join(" | ");
    const forceText=ebp.muscles.map(m=>{const d=epley(forceD[m.id+"_r"],forceD[m.id+"_k"]);const g=epley(forceG[m.id+"_r"],forceG[m.id+"_k"]);return m.name+": D="+(d!=null?d+"kg":"NR")+" G="+(g!=null?g+"kg":"NR");}).join(" | ");
    const fxText=ebp.fx.map((f,i)=>f+(fxLimites[i]?" [LIMITÉ]":" [conservé]")).join(" | ");
    const questText=Object.entries(questAns).filter(([,v])=>v&&(v.manual||Object.keys(v).length>0)).map(([k,v])=>k+": "+(v.manual||"rempli")).join(" | ")||"non administrés";
    const sys="Tu es kinésithérapeute expert EBP. Rédige un bilan kinésithérapique initial complet, structuré et rigoureux en français. Sections : Anamnèse | Évaluation douleur | Bilan articulaire | Bilan musculaire | Tests cliniques | Analyse fonctionnelle | Hypothèses diagnostiques | Objectifs SMART | Programme de rééducation.";
    const msg="PATIENT: "+(patient.nom||"Anonyme")+", "+(patient.age||"?")+" ans, "+(patient.sexe||"NR")+"\nPROFESSION: "+(patient.profession||"NR")+" | SPORT: "+(patient.sport||"NR")+"\nMOTIF: "+(patient.motif||"non précisé")+"\nCONTEXTE/ATCD: "+(patient.context||"aucun")+"\nREGION: "+artLabel+"\nEVA: repos="+evaR+"/10 mouvement="+evaMvt+"/10 nuit="+evaN+"/10\nTYPE DOULEUR: "+(dType||"non précisé")+" | IRRADIATIONS: "+(irrad||"aucune")+"\nFACTEURS: "+(factAgg||"non précisé")+"\nMOUVEMENTS DOULOUREUX: "+mouvText+"\nTESTS CLINIQUES POSITIFS: "+(positifs.map(t=>t.name+(testResults[t.id]?" ("+testResults[t.id]+")":"")).join(", ")||"aucun")+"\nAMPLITUDES: "+ampsText+"\nFORCE 1RM: "+forceText+"\nFONCTIONNEL: "+fxText+"\nQUESTIONNAIRES: "+questText+"\nNOTES: "+(extraNotes||"aucune");
    try{
      const result=await callClaude(sys,msg,1800);
      if(!result||result.trim().length<50)throw new Error("Réponse vide ou trop courte");
      setBilanResult(result);
    }catch(e){
      console.error("Bilan error:",e);
      alert("Erreur lors de la génération: "+e.message+"\n\nConseils:\n• Vérifiez votre connexion internet\n• Réessayez dans quelques secondes\n• Assurez-vous d'être sur l'app Netlify et non depuis Claude directement");
    }
    setBilanLoading(false);
  };

  const subs=[

    {id:"fonc",l:"3·🎯 Fonctionnel"},{id:"amp",l:"4·📐 Amplitudes"},
    {id:"force",l:"5·💪 Force"},{id:"tests",l:"🔬 Tests cliniques"},
    ...(ebp?.hasMck?[{id:"mck",l:"🔄 McKenzie"}]:[]),

          <div className="fg"><label>Sport</label><input placeholder="Tennis" value={patient.sport||""} onChange={e=>setPatient({...patient,sport:e.target.value})}/></div>

          <textarea value={voiceText} onChange={e=>setVoiceText(e.target.value)}
            placeholder="Ex: EVA repos 3 effort 6 flexion épaule 100 degrés abduction 80 degrés rotation externe 20 degrés force biceps déficitaire..."
            style={{width:"100%",minHeight:90,background:C.bg,border:"1px solid "+C.teal+"55",borderRadius:10,padding:"10px 12px",color:C.text,fontFamily:"Inter,sans-serif",fontSize:13,lineHeight:1.7,resize:"vertical",outline:"none",boxSizing:"border-box"}}/>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:10}}>
            {voiceText.trim()&&<button className="btn btn-p" onClick={extractVoice} disabled={voiceLoading}>{voiceLoading?<><Spin/>Extraction en cours...</>:"✨ Extraire et remplir les champs"}</button>}
            {voiceText&&<button className="btn btn-s" onClick={()=>setVoiceText("")}>🗑 Effacer</button>}
          </div>
        </div>

      {artho&&ebp&&(
        <>
          <div className="stabs">

function PostOpTab({arthoFilter=null}){
  const [intervention,setIntervention]=useState(null);

  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState("");

  const filtered=arthoFilter?POSTOP.filter(i=>arthoFilter.includes(i.id)):POSTOP;
  const interv=POSTOP.find(i=>i.id===intervention);

  const generate=async()=>{
    if(!intervention||!phase){alert("Sélectionnez une intervention et une phase.");return;}
    setLoading(true);setResult("");
    const sys="Tu es kinésithérapeute expert en traumatologie. Rédige un bilan post-opératoire complet EBP. Uniquement le bilan rédigé.";

    try{setResult(await callClaude(sys,msg,1200));}catch{alert("Erreur.");}
    setLoading(false);
  };
  if(arthoFilter?.length===0)return <div className="card"><div style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>Aucun protocole post-opératoire spécifique pour cette articulation.</div></div>;

              <div style={{fontSize:18,marginBottom:4}}>{i.e}</div>
              <div style={{fontSize:12,fontWeight:700,color:intervention===i.id?C.accent:C.text}}>{i.label}</div>
            </button>
          ))}

              return <div style={{background:C.card2,border:"1px solid "+(ok?C.accent:C.red)+"44",borderRadius:10,padding:"11px 14px",marginTop:10,display:"flex",alignItems:"center",gap:12}}><span style={{fontFamily:"JetBrains Mono",fontSize:26,fontWeight:700,color:ok?C.accent:C.red}}>{total}/20</span><span className="badge" style={{background:(ok?C.accent:C.red)+"22",color:ok?C.accent:C.red}}>{ok?"✓ ≤5 Avis favorable":"✗ >5 Avis défavorable"}</span></div>;
            })()}
          </div>
          <div className="card">
            <div className="slabel" style={{color:C.teal}}>✅ Critères RTP Avis favorable reprise sport pivot contact</div>
            {(()=>{
              const isoKeys=["i60q","i60j","i24q","i24j","e30q","e30j"];
              const hopKeys=["h6s","h6t","h6h"];
              const allDefOk=[...isoKeys,...hopKeys].every(k=>{const s=parseFloat(d[k]?.sain||0),o=parseFloat(d[k]?.opere||0);if(!s||!o)return true;return Math.abs((1-o/s)*100)<=15;});
              const lessTotal=["ll1","ll2","ll3","ll4","ll5","ll6","ll7","ll8","ll9","ll10"].reduce((a,k)=>a+(d[k]?.v??0),0);
              const lessOk=lessTotal<=5;
              const aclrsiAns=d["q_ACL-RSI"]||[];const ars=aclrsiScore(aclrsiAns);const aclrsiOk=ars!=null?ars>=72:null;
              return [
                ["Déficit force musculaire et fonctionnel moins de 15%",allDefOk],
                ["LESS Test 5 pts ou moins score actuel "+lessTotal,lessOk],
                ["ACL-RSI plus de 72%"+(ars!=null?" score "+ars+"%":""),aclrsiOk],
              ].map(([label,ok],i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:ok===true?C.accent+"08":ok===false?C.red+"08":C.bg,border:"1px solid "+(ok===true?C.accent:ok===false?C.red:C.border),borderRadius:9,marginBottom:6}}>
                  <span style={{fontSize:18}}>{ok===true?"✅":ok===false?"❌":"⬜"}</span>
                  <span style={{fontSize:12}}>{label}</span>
                </div>
              ));
            })()}
          </div>
        </>
      )}

      <button className="btn btn-p" style={{width:"100%",marginTop:8}} onClick={generate} disabled={loading}>
        {loading?<><Spin/>Rédaction du bilan RTP...</>:"✨ Générer le compte-rendu RTP"}
      </button>
      {result&&(
        <div className="card" style={{marginTop:12}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div className="slabel" style={{margin:0,color:C.accent}}>📋 Bilan RTP Genou — {period==="3mois"?"3 mois":"6 mois"}</div>
            <button className="btn btn-o" style={{padding:"4px 10px",fontSize:11}} onClick={()=>navigator.clipboard.writeText(result)}>📋 Copier</button>
          </div>
          <div className="rbox">{result}</div>
        </div>
      )}
    </div>
  );
}

const SK="kine_suivi_v3";
const loadS=()=>{try{return JSON.parse(localStorage.getItem(SK)||"[]");}catch{return[];}};
const saveS=s=>localStorage.setItem(SK,JSON.stringify(s));
const EMPTY_EX=()=>({id:Date.now()+Math.random(),nom:"",series:"",reps:"",charge:"",tempo:""});

  const extractVoice=async()=>{
    if(!voiceText.trim())return;setVoiceLoading(true);

      const raw=await callClaude("Extrais les données d une fiche de séance. JSON uniquement.",`Dictée: "${voiceText}"\nExtrait: {"evaRepos":null,"evaEffort":null,"techniquesPassives":null,"amplitudes":[{"mouvement":"","valeur":"","bilan":""}],"exercises":[{"nom":"","series":"","reps":"","charge":"","tempo":""}],"consignes":null,"notes":null}`,700);
      const data=JSON.parse(raw.replace(/```json|```/g,"").trim());
      if(data.evaRepos!=null)setEvaR(Math.min(10,Math.max(0,+data.evaRepos)));
      if(data.evaEffort!=null)setEvaE(Math.min(10,Math.max(0,+data.evaEffort)));
      if(data.techniquesPassives)setTechniques(data.techniquesPassives);
      if(data.amplitudes?.length)setAmplitudes(data.amplitudes.map((a,i)=>({id:Date.now()+i,mouvement:a.mouvement||"",valeur:a.valeur||"",bilan:a.bilan||""})));
      if(data.exercises?.length)setExercises(data.exercises.map(e=>({id:Date.now()+Math.random(),nom:e.nom||"",series:e.series||"",reps:e.reps||"",charge:e.charge||"",tempo:e.tempo||""})));
      if(data.consignes)setConsignes(data.consignes);
      if(data.notes)setNotes(data.notes);
      setVoiceText("");alert("✅ Fiche de séance pré-remplie !");
    }catch{alert("Extraction échouée.");}
    setVoiceLoading(false);
  };

  const addSession=async()=>{
    setLoading(true);setSummary("");
    const past=sessions.filter(s=>s.patient===patientName);
    const exText=exercises.filter(e=>e.nom).map(e=>e.nom+" — "+e.series+"×"+e.reps+(e.charge?" @ "+e.charge+"kg":"")+(e.tempo?" tempo "+e.tempo:"")).join(" | ");
    const ampText=amplitudes.filter(a=>a.mouvement&&a.valeur).map(a=>a.mouvement+": "+a.valeur+(a.bilan?" (bilan: "+a.bilan+")":"")).join(" | ");
    const ctx=past.length>0?"Séances précédentes:\n"+past.map((s,i)=>"S"+(i+1)+"("+s.date+") EVA repos:"+s.evaRepos+"/10 effort:"+s.evaEffort+"/10: "+s.summary).join("\n")+"\n\n":"";
    const sys="Tu es kinésithérapeute. CR de séance structuré techniques EVA repos/effort amplitudes vs bilan exercices séries/reps/charge/tempo tolérance évolution consignes. Max 15 lignes.";
    const msg=ctx+"Séance "+(past.length+1)+" — "+new Date().toLocaleDateString("fr-FR")+" — "+(patientName||"Patient")+(jourJ!=null?" — J+"+jourJ+" "+dateRefLabel:"")+"\nEVA repos:"+evaR+"/10 effort:"+evaE+"/10\nTechniques: "+(techniques||"NR")+"\nAmplitudes: "+(ampText||"NR")+"\nExercices: "+(exText||"NR")+"\nConsignes: "+(consignes||"NR")+"\nNotes: "+(notes||"—");
    const result=await callClaude(sys,msg,800);setSummary(result);
    const newS={id:Date.now(),patient:patientName||"Patient",date:new Date().toLocaleDateString("fr-FR"),numero:past.length+1,evaRepos:evaR,evaEffort:evaE,techniques,amplitudes:amplitudes.filter(a=>a.mouvement&&a.valeur),exercises:exercises.filter(e=>e.nom),consignes,notes,summary:result,eva24h:null,jourJ:jourJ!=null?jourJ:null,dateRefLabel:jourJ!=null?dateRefLabel:null};
    const updated=[...sessions,newS];setSessions(updated);saveS(updated);setActiveIdx(updated.length-1);
    setEvaR(0);setEvaE(0);setTechniques("");setConsignes("");setNotes("");
    setAmplitudes([{id:Date.now(),mouvement:"",valeur:"",bilan:""}]);setExercises([EMPTY_EX()]);
    setLoading(false);

  const save24h=id=>{const updated=sessions.map(s=>s.id===id?{...s,eva24h:eva24hVal}:s);setSessions(updated);saveS(updated);setUpd24h(null);};

        <textarea value={voiceText} onChange={e=>setVoiceText(e.target.value)}

          style={{width:"100%",minHeight:80,background:C.bg,border:"1px solid "+C.teal+"55",borderRadius:10,padding:"10px 12px",color:C.text,fontFamily:"Inter,sans-serif",fontSize:13,lineHeight:1.7,resize:"vertical",outline:"none",boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:10}}>
          {voiceText.trim()&&<button className="btn btn-p" onClick={extractVoice} disabled={voiceLoading}>{voiceLoading?<><Spin/>Extraction...</>:"✨ Extraire et remplir"}</button>}
          {voiceText&&<button className="btn btn-s" onClick={()=>setVoiceText("")}>🗑 Effacer</button>}
        </div>
      </div>

      <div className="card">
        <div className="slabel" style={{color:C.accent}}>📅 Fiche de séance</div>
        <div className="g2" style={{marginBottom:14}}>
          <div className="fg"><label>Patient</label><input list="pts" placeholder="Dupont Jean" value={patientName} onChange={e=>setPatientName(e.target.value)}/><datalist id="pts">{patList.map(p=><option key={p} value={p}/>)}</datalist></div>
          <div className="fg"><label>Date</label><input readOnly value={new Date().toLocaleDateString("fr-FR")} style={{color:C.muted}}/></div>
        </div>
        <div style={{background:C.card2,border:"1px solid "+C.border,borderRadius:11,padding:"13px 15px",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:C.blue,textTransform:"uppercase",letterSpacing:".8px"}}>📅 Suivi J+ post-op post-lésion</div>

                            <span className="badge bg" style={{fontFamily:"JetBrains Mono"}}>{ex.series}×{ex.reps}</span>
                            {ex.charge&&<span className="badge bb" style={{fontFamily:"JetBrains Mono"}}>@ {ex.charge}kg</span>}
                            {ex.tempo&&<span className="badge" style={{background:C.muted+"22",color:C.muted,fontFamily:"JetBrains Mono"}}>{ex.tempo}</span>}
                          </div>
                        ))}
                      </div>
                    )}
                    {sessions[idx].consignes&&<div style={{marginBottom:12,background:C.teal+"10",border:"1px solid "+C.teal+"33",borderRadius:8,padding:"8px 11px"}}><div style={{fontSize:10,fontWeight:700,color:C.teal,marginBottom:4}}>📋 CONSIGNES</div><div style={{fontSize:12}}>{sessions[idx].consignes}</div></div>}
                    <div style={{fontSize:12,lineHeight:1.8,whiteSpace:"pre-wrap"}}>{sessions[idx].summary}</div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const MUSCLE_TO_DB={
  sus:"sus",sous:"sous",subscap:"subscap",delt:"sus",
  biceps:"biceps",triceps:"triceps",thenar:"thenar",
  quad:"quad",isch:"isch",gastro:"gastro",gastro2:"gastro2",
  gfess:"gfess",mfess:"mfess",psoas:"psoas",psoas2:"gfess",
  fess:"gfess",abdo:"abdo",para:"para",tibant:"tibant",
  trap:"trap",scm:"scm",masseter:"masseter",m1:"abdo",
};

function ExercicesTab({patientNom="",extracted=null}){
  const [mode,setMode]=useState(bilanContext?"bilan":"manuel");
  const [patho,setPatho]=useState("");
  const [zone,setZone]=useState("");
  const [niveau,setNiveau]=useState("débutant");
  const [objectif,setObjectif]=useState("");
  const [nbEx,setNbEx]=useState(5);
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);
  const [copied,setCopied]=useState(false);

  const buildBilanContext=()=>{
    if(!bilanContext)return null;
    const {artho,artLabel,evaR,evaMvt,amplD,amplG,ebp,forceD,forceG,checkedTests,mouvD,fxLimites,questAns,extraNotes,patient}=bilanContext;
    if(!artho||!ebp)return null;
    const defAmpl=ebp.amp.filter(a=>{
      const vD=parseFloat(amplD?.[a.id]||0);
      const pD=vD&&a.n?vD/a.n*100:100;
      return pD<80;
    }).map(a=>a.l+": D:"+(amplD?.[a.id]||"NR")+" G:"+(amplG?.[a.id]||"NR")+" norme "+a.n+a.u).join(", ");
    const defForce=ebp.muscles.filter(m=>{const rm=epley(forceD?.[m.id+"_r"],forceD?.[m.id+"_k"]);return rm&&m.nm&&rm/m.nm<0.8;}).map(m=>m.name).join(", ");
    const positifs=ebp.tests.filter(t=>checkedTests?.[t.id]).map(t=>t.name).join(", ");
    const limitFx=ebp.fx.filter((_,i)=>fxLimites?.[i]).join(", ");
    const mouvDoulText=(mouvD||[]).filter(m=>m.mouvement).map(m=>m.mouvement+" EVA "+m.eva+"/10").join(", ");
    return "Patient: "+(patient?.nom||patientNom||"NR")+", "+(patient?.age||"?")+"ans\nRégion: "+artLabel+"\nEVA repos:"+(evaR||0)+"/10 mvt:"+(evaMvt||0)+"/10\nAmplitudes déficitaires: "+(defAmpl||"aucune")+"\nForce insuffisante: "+(defForce||"aucune")+"\nTests positifs: "+(positifs||"aucun")+"\nActivités limitées: "+(limitFx||"aucune")+"\nMouvements douloureux: "+(mouvDoulText||"aucun");
  };

  const generateFromDB=()=>{
    if(!bilanContext?.ebp)return null;
    const {ebp,forceD,forceG}=bilanContext;
    const defMuscles=ebp.muscles.filter(m=>{const rm=epley(forceD?.[m.id+"_r"],forceD?.[m.id+"_k"]);return !rm||(m.nm&&rm/m.nm<0.8);});
    const muscles=defMuscles.length>0?defMuscles:ebp.muscles;
    const exercises=[];const seen=new Set();
    muscles.forEach(m=>{
      const key=MUSCLE_TO_DB[m.id];
      if(!key||!EX_DB[key])return;
      const exs=EX_DB[key];
      const iso1=exs.find(e=>e.cat==="renfo_isole"&&e.niv===1&&!seen.has(e.id));
      const iso2=exs.find(e=>e.cat==="renfo_isole"&&e.niv===2&&!seen.has(e.id));
      const fonc=exs.find(e=>e.cat==="fonctionnel"&&!seen.has(e.id));
      [iso1,iso2,fonc].forEach(e=>{if(e){exercises.push(e);seen.add(e.id);}});
    });
    return exercises.slice(0,nbEx).map(ex=>({
      titre:ex.label,
      objectif:(ex.cat==="renfo_isole"?"💪 Renforcement isolé — Niv."+ex.niv:"🏋️ Exercice fonctionnel — Niv."+ex.niv),
      position_depart:ex.pos,description:ex.desc,series:ex.series,repetitions:ex.reps,
      tempo:ex.tempo,precaution:"Compensation à éviter : "+ex.comp,progression:ex.prog,materiel:ex.mat,
    }));
  };

  const generate=async()=>{
    setLoading(true);setResult(null);
    if(mode==="bilan"){
      const exs=generateFromDB();
      if(exs&&exs.length>0){
        setResult({exercises:exs,conseil_global:"Programme généré depuis la base d'exercices cliniques, ciblé sur les déficits du bilan.",message_patient:"Voici votre programme personnalisé. Respectez les consignes et signalez toute douleur à votre kinésithérapeute."});
      }else{
        const ctx=buildBilanContext();
        if(!ctx){setResult({error:true,msg:"Aucun bilan disponible. Passez en mode Manuel."});setLoading(false);return;}
        const sys='Tu es kinésithérapeute expert. Programme exercices domicile. JSON uniquement: {"exercises":[{"titre":"","objectif":"","position_depart":"","description":"","series":"","repetitions":"","tempo":"","precaution":"","progression":"","materiel":""}],"message_patient":"","conseil_global":""}';
        try{const raw=await callClaude(sys,"BILAN:\n"+ctx+"\nGénère "+nbEx+" exercices ciblés.",1200);setResult(JSON.parse(raw.replace(/```json|```/g,"").trim()));}
        catch{setResult({error:true,msg:"Erreur. Réessayez."});}
      }
    }else{
      const sys='Tu es kinésithérapeute expert. Programme exercices domicile. JSON uniquement: {"exercises":[{"titre":"","objectif":"","position_depart":"","description":"","series":"","repetitions":"","tempo":"","precaution":"","progression":"","materiel":""}],"message_patient":"","conseil_global":""}';
      try{const raw=await callClaude(sys,"Pathologie: "+patho+" Zone: "+zone+" Niveau: "+niveau+" Objectif: "+objectif+" Génère "+nbEx+" exercices progressifs.",1200);setResult(JSON.parse(raw.replace(/```json|```/g,"").trim()));}
      catch{setResult({error:true,msg:"Erreur. Réessayez."});}
    }
    setLoading(false);
  };

  const getText=()=>{
    if(!result?.exercises)return"";
    let t="PROGRAMME EXERCICES À DOMICILE\n"+(patientNom?"Patient: "+patientNom+"\n":"")+(mode==="bilan"?"Depuis le bilan clinique":"Pathologie: "+patho)+"\nDate: "+new Date().toLocaleDateString("fr-FR")+"\n\n";
    result.exercises.forEach((ex,i)=>{t+=(i+1)+". "+ex.titre+"\n   🎯 "+ex.objectif+"\n   📍 "+ex.position_depart+"\n   "+ex.description+"\n   📌 "+ex.series+"×"+ex.repetitions+(ex.tempo?" — Tempo: "+ex.tempo:"")+"\n"+(ex.materiel&&ex.materiel!=="Aucun"?"   🛠 "+ex.materiel+"\n":"")+(ex.precaution?"   ⚠️ "+ex.precaution+"\n":"")+(ex.progression?"   📈 "+ex.progression+"\n":"")+"\n";});
    if(result.message_patient)t+="\n💬 "+result.message_patient;
    return t;
  };

  return(
    <div>
      <div style={{background:"linear-gradient(135deg,"+C.purple+"22,"+C.blue+"11)",border:"1px solid "+C.purple+"44",borderRadius:16,padding:"14px 18px",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:700,color:C.purple,marginBottom:3}}>🏠 Exercices à la maison{patientNom?" — "+patientNom:""}</div>
        <div style={{fontSize:11,color:C.muted}}>Programme personnalisé depuis le bilan ou créé manuellement</div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {[["bilan","🔬 Depuis le bilan"],["manuel","✏️ Manuel"]].map(([key,label])=>(
          <button key={key} onClick={()=>{setMode(key);setResult(null);}} style={{flex:1,padding:"10px 12px",borderRadius:12,border:"1px solid "+(mode===key?C.purple:C.border),background:mode===key?C.purple+"20":C.bg,color:mode===key?C.purple:C.muted,fontFamily:"Inter,sans-serif",fontSize:13,fontWeight:700,cursor:"pointer"}}>{label}</button>
        ))}
      </div>
      <div className="card">
        {mode==="bilan"&&(
          <div>
            {bilanContext?.artho?(
              <div style={{background:C.accent+"10",border:"1px solid "+C.accent+"33",borderRadius:10,padding:"11px 14px",marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:C.accent,marginBottom:6}}>✅ Bilan disponible — {bilanContext.artLabel}</div>
                <div style={{fontSize:11,color:C.muted,lineHeight:1.8}}>
                  {bilanContext.evaR>0&&<span style={{display:"block"}}>🌡 EVA repos: <b>{bilanContext.evaR}/10</b> · effort: <b>{bilanContext.evaMvt}/10</b></span>}
                  {(()=>{const def=bilanContext.ebp?.muscles.filter(m=>{const rm=epley(bilanContext.forceD?.[m.id+"_r"],bilanContext.forceD?.[m.id+"_k"]);return !rm||(m.nm&&rm/m.nm<0.8);});return def?.length>0&&<span style={{display:"block"}}>💪 Muscles déficitaires: <b>{def.map(m=>m.name).join(", ")}</b></span>;})()}
                  {(()=>{const lim=bilanContext.ebp?.fx.filter((_,i)=>bilanContext.fxLimites?.[i]);return lim?.length>0&&<span style={{display:"block"}}>🎯 Activités limitées: <b>{lim.join(", ")}</b></span>;})()}
                </div>
              </div>
            ):(
              <div style={{background:C.yellow+"10",border:"1px solid "+C.yellow+"44",borderRadius:10,padding:"11px 14px",marginBottom:14}}>
                <div style={{fontSize:11,color:C.yellow,fontWeight:700}}>⚠️ Aucun bilan renseigné</div>
                <div style={{fontSize:11,color:C.muted,marginTop:4}}>Remplissez l'onglet "Bilan initial" puis revenez ici, ou passez en mode Manuel.</div>
              </div>
            )}
            <div className="fg" style={{marginBottom:12}}>
              <label>Nombre d'exercices</label>
              <div style={{display:"flex",gap:8}}>
                {[4,5,6,8].map(n=><button key={n} onClick={()=>setNbEx(n)} style={{flex:1,padding:"8px",borderRadius:8,border:"1px solid "+(nbEx===n?C.purple:C.border),background:nbEx===n?C.purple+"20":C.bg,color:nbEx===n?C.purple:C.muted,fontFamily:"JetBrains Mono",fontSize:14,fontWeight:700,cursor:"pointer"}}>{n}</button>)}
              </div>
            </div>
          </div>
        )}
        {mode==="manuel"&&(
          <div>
            <div className="fg" style={{marginBottom:10}}><label>Pathologie / Contexte</label><input placeholder="Tendinopathie coiffe, post-op LCA..." value={patho} onChange={e=>setPatho(e.target.value)}/></div>
            <div className="g2" style={{marginBottom:10}}>
              <div className="fg"><label>Zone anatomique</label><input placeholder="Épaule droite, genou G..." value={zone} onChange={e=>setZone(e.target.value)}/></div>
              <div className="fg"><label>Niveau patient</label><select value={niveau} onChange={e=>setNiveau(e.target.value)}><option>débutant</option><option>intermédiaire</option><option>avancé</option></select></div>
            </div>
            <div className="fg" style={{marginBottom:10}}><label>Objectif principal</label><input placeholder="Renforcement, mobilité, proprioception..." value={objectif} onChange={e=>setObjectif(e.target.value)}/></div>
            <div className="fg" style={{marginBottom:12}}>
              <label>Nombre d'exercices</label>
              <div style={{display:"flex",gap:8}}>
                {[4,5,6,8].map(n=><button key={n} onClick={()=>setNbEx(n)} style={{flex:1,padding:"8px",borderRadius:8,border:"1px solid "+(nbEx===n?C.purple:C.border),background:nbEx===n?C.purple+"20":C.bg,color:nbEx===n?C.purple:C.muted,fontFamily:"JetBrains Mono",fontSize:14,fontWeight:700,cursor:"pointer"}}>{n}</button>)}
              </div>
            </div>
          </div>
        )}
        <button className="btn btn-p" style={{width:"100%"}} onClick={generate} disabled={loading||(mode==="manuel"&&!patho)}>
          {loading?<><Spin/>Génération en cours...</>:mode==="bilan"?"🔬 Générer depuis le bilan":"✨ Générer le programme"}
        </button>
      </div>
      {result?.error&&<div style={{background:C.red+"10",border:"1px solid "+C.red+"44",borderRadius:12,padding:"12px 16px",marginBottom:14}}><div style={{fontSize:12,color:C.red,fontWeight:700}}>⚠️ {result.msg||"Erreur"}</div></div>}
      {result?.exercises&&(
        <div className="card">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div>
              <div className="slabel" style={{margin:0,color:C.purple}}>💪 Programme — {result.exercises.length} exercices</div>
              {mode==="bilan"&&bilanContext?.artLabel&&<div style={{fontSize:11,color:C.muted,marginTop:2}}>Ciblé — {bilanContext.artLabel}</div>}
            </div>
            <button className="btn btn-o" style={{padding:"4px 10px",fontSize:11}} onClick={()=>{navigator.clipboard.writeText(getText());setCopied(true);setTimeout(()=>setCopied(false),2000);}}>{copied?"✓ Copié":"📋 Copier"}</button>
          </div>
          {result.conseil_global&&<div style={{background:C.blue+"10",border:"1px solid "+C.blue+"33",borderRadius:10,padding:"10px 14px",marginBottom:14}}><div style={{fontSize:10,fontWeight:700,color:C.blue,textTransform:"uppercase",marginBottom:4}}>💡 Conseil global</div><div style={{fontSize:12,lineHeight:1.7}}>{result.conseil_global}</div></div>}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {result.exercises.map((ex,i)=>(
              <div key={i} style={{background:C.bg,border:"1px solid "+C.border,borderRadius:12,padding:14}}>
                <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:8}}>
                  <div style={{flex:1}}>

          </div>
          {result.message_patient&&<div style={{marginTop:12,background:C.accent+"10",border:"1px solid "+C.accent+"33",borderRadius:9,padding:"11px 14px"}}><div style={{fontSize:10,color:C.accent,fontWeight:700,textTransform:"uppercase",marginBottom:4}}>💬 Message patient</div><div style={{fontSize:12,lineHeight:1.7}}>{result.message_patient}</div></div>}

        </div>
      )}
    </div>
  );
}

function CoachingTab({patientNom=""}){
  const [section,setSection]=useState("amp");

  const [mouvData,setMouvData]=useState({});
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState("");
  const [vmaMode,setVmaMode]=useState("cap");
  const [vmaProto,setVmaProto]=useState("demi_cooper");
  const [vmaDist,setVmaDist]=useState("");
  const [vmaPalier,setVmaPalier]=useState("");
  const [vmaPoids,setVmaPoids]=useState("");
  const [vmaWmax,setVmaWmax]=useState("");
  const [vmaFcMax,setVmaFcMax]=useState("");
  const [vmaFcRepos,setVmaFcRepos]=useState("");

  const setM=(id,field,val)=>setMouvData(p=>({...p,[id]:{...(p[id]||{}),[field]:val}}));
  const toggleCrit=(id,cid)=>setMouvData(p=>({...p,[id]:{...(p[id]||{}),[cid]:!(p[id]||{})[cid]}}));
  const artList=[...new Set(COACH_AMP.map(a=>a.art))];

  const ratioITO=(()=>{
    const front=parseFloat(mouvData["gainage_ito"]?.gi_front||0);
    const latD=parseFloat(mouvData["gainage_ito"]?.gi_latD||0);
    const latG=parseFloat(mouvData["gainage_ito"]?.gi_latG||0);
    if(!front)return null;
    return{
      ratD:latD?Math.round(latD/front*100)/100:null,
      ratG:latG?Math.round(latG/front*100)/100:null,
      asym:latD&&latG?Math.round(Math.abs(latD-latG)/Math.max(latD,latG)*100):null
    };
  })();

  const calcVMA_CAP=()=>{
    if(vmaProto==="demi_cooper"||vmaProto==="cooper"){
      const d=+vmaDist; if(!d)return null;
      const t=vmaProto==="demi_cooper"?6:12;
      const vma=Math.round(d/t*10)/10;
      const vo2=vmaProto==="demi_cooper"?Math.round((d/1000-0.3771)/0.0269):Math.round(d/35-11.3);
      return{vma,vo2};
    }
    if(vmaProto==="luc_leger"||vmaProto==="vameval"){
      const p=+vmaPalier; if(!p)return null;
      const vma=vmaProto==="luc_leger"?Math.round((8+0.5*p)*10)/10:Math.round(p*10)/10;
      const vo2=Math.round(vma*3.5);
      return{vma,vo2};
    }
    return null;
  };

  const calcPMA=()=>{
    const w=+vmaWmax; const kg=+vmaPoids;
    if(!w||!kg)return null;
    const wkg=Math.round(w/kg*100)/100;
    const vo2=Math.round(w*10.8/kg+7);
    const fcMax=+vmaFcMax||null; const fcRepos=+vmaFcRepos||null;
    const vo2karvo=fcMax&&fcRepos?Math.round(15*(fcMax/fcRepos)*10)/10:null;
    return{w,wkg,vo2,vo2karvo,fcMax};
  };

  const niveauVMA=(v)=>v<12?"Faible":v<15?"Moyen":v<17?"Bon":v<19?"Très bon":"Excellent";
  const nColorVMA=(v)=>v<12?C.red:v<15?C.orange:v<17?C.yellow:v<19?C.blue:C.accent;

      const pD=d&&a.n?Math.round(parseFloat(d)/a.n*100):null;
      const pG=g&&a.n?Math.round(parseFloat(g)/a.n*100):null;
      return a.art+" — "+a.label+": D="+(d||"NR")+a.u+(pD?" ("+pD+"%)":"")+"  G="+(g||"NR")+a.u+(pG?" ("+pG+"%)":"");
    }).join("\n");
    const mouvLines=COACH_MOUVEMENTS.map(mv=>{
      const data=mouvData[mv.id]||{};

                <div className="g2" style={{marginBottom:10}}>

                  <div className="fg"><label>Poids (kg)</label><input type="number" value={vmaPoids} onChange={e=>setVmaPoids(e.target.value)} placeholder="70" style={{fontFamily:"JetBrains Mono",fontSize:18,fontWeight:700,textAlign:"center"}}/></div>
                </div>
                <div className="g2" style={{marginBottom:12}}>
                  <div className="fg"><label>FC max (bpm)</label><input type="number" value={vmaFcMax} onChange={e=>setVmaFcMax(e.target.value)} placeholder="185"/></div>

                    </div>
                    <div style={{textAlign:"center",marginBottom:12}}><span className="badge" style={{background:nColorWkg(pmaRes.wkg)+"22",color:nColorWkg(pmaRes.wkg),padding:"5px 14px",fontSize:13}}>{niveauWkg(pmaRes.wkg)}</span></div>
                    <div style={{fontSize:10,fontWeight:700,color:C.muted,textTransform:"uppercase",marginBottom:8}}>Zones d'entraînement</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center"}}>
                      {ZONES_VELO.map(([lo,hi,label,col])=>(
                        <div key={lo} style={{background:col+"15",border:"1px solid "+col+"44",borderRadius:9,padding:"8px 10px",minWidth:110,textAlign:"center"}}>
                          <div style={{fontSize:10,color:col,fontWeight:700,marginBottom:3}}>{label}</div>
                          <div style={{fontFamily:"JetBrains Mono",fontSize:12,fontWeight:700}}>{Math.round(pmaRes.w*lo/100)}-{Math.round(pmaRes.w*hi/100)} W</div>
                          {pmaRes.fcMax&&<div style={{fontFamily:"JetBrains Mono",fontSize:11,color:C.muted}}>{Math.round(pmaRes.fcMax*lo/100)}-{Math.round(pmaRes.fcMax*hi/100)} bpm</div>}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

      <button className="btn btn-p" style={{width:"100%",marginTop:8}} onClick={generateReport} disabled={loading}>
        {loading?<><Spin/>Génération du bilan coaching...</>:"✨ Générer le bilan coaching complet"}
      </button>
      {result&&(
        <div className="card" style={{marginTop:12}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div className="slabel" style={{margin:0,color:C.accent}}>📋 Bilan coaching{patientNom?" — "+patientNom:""}</div>
            <button className="btn btn-o" style={{padding:"4px 10px",fontSize:11}} onClick={()=>navigator.clipboard.writeText(result)}>📋 Copier</button>
          </div>
          <div className="rbox">{result}</div>
        </div>
      )}
    </div>
  );
}

function NouveauPatientScreen({extracted,setExtracted,patientFromOrdo,setPatientFromOrdo,onBack}){
  const [subTab,setSubTab]=useState(0);
  const [bilanContext,setBilanContext]=useState(null);
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
        <button onClick={onBack} className="btn btn-s" style={{padding:"7px 12px",fontSize:18}}>←</button>
        <div style={{fontSize:17,fontWeight:700}}>Nouveau patient</div>
      </div>
      <div className="tabs" style={{marginBottom:16}}>
        {[["👤","Coordonnées"],["📋","Bilan initial"],["📈","Suivi séances"],["🏠","Exercices maison"],["🏅","Coaching"]].map(([icon,label],i)=>(
          <button key={i} className={"tab "+(subTab===i?"on":"")} onClick={()=>setSubTab(i)} style={{flex:1}}>{icon} {label}</button>
        ))}
      </div>
      {subTab===0&&(
        <div>
          <CoordonneesTab extracted={extracted} setExtracted={setExtracted} setPatientFromOrdo={setPatientFromOrdo}/>
          <button className="btn btn-p" style={{width:"100%",marginTop:8}} onClick={()=>setSubTab(1)}>Continuer → Bilan initial</button>
        </div>
      )}
      {subTab===1&&<BilanTab extracted={extracted} patientFromOrdo={patientFromOrdo} onBilanChange={setBilanContext}/>}
      {subTab===2&&<SuiviTab initialPatient={patientFromOrdo?.nom||""}/>}
      {subTab===3&&<ExercicesTab patientNom={patientFromOrdo?.nom||""} extracted={extracted} bilanContext={bilanContext}/>}
      {subTab===4&&<CoachingTab patientNom={patientFromOrdo?.nom||""}/>}
    </div>
  );
}

            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {[{emoji:"📋",title:"Bilan intermédiaire final",desc:"Bilan EBP post-op RTP questionnaires amplitudes force",color:C.accent,screen:"bilan"},{emoji:"📈",title:"Suivi des séances",desc:"Fiche de séance structurée EVA exercices consignes",color:C.blue,screen:"suivi"},{emoji:"🏠",title:"Exercices à la maison",desc:"Générer et envoyer un programme personnalisé",color:C.purple,screen:"exercices"},{emoji:"🏅",title:"Coaching",desc:"Mobilité articulaire, mouvements fondamentaux, gainage",color:C.orange,screen:"coaching"}].map(item=>(
                <button key={item.screen} onClick={()=>goTo(item.screen)} style={{padding:"20px",borderRadius:16,border:"1px solid "+item.color+"44",background:item.color+"0A",cursor:"pointer",textAlign:"left",width:"100%",fontFamily:"Inter,sans-serif"}}>
                  <div style={{fontSize:28,marginBottom:8}}>{item.emoji}</div>
                  <div style={{fontSize:16,fontWeight:700,color:item.color}}>{item.title}</div>
                  <div style={{fontSize:13,color:C.muted,marginTop:4}}>{item.desc}</div>
                </button>
              ))}
            </div>
          </div>
        )}

        {screen==="nouveau"&&<NouveauPatientScreen extracted={extracted} setExtracted={setExtracted} patientFromOrdo={patientFromOrdo} setPatientFromOrdo={setPatientFromOrdo} onBack={()=>goTo("home")}/>}
        {screen==="bilan"&&<WithBack label="Bilan" backTo="patient-menu"><BilanTab extracted={extracted} patientFromOrdo={{...patientFromOrdo,nom:selectedPatient||patientFromOrdo?.nom}}/></WithBack>}
        {screen==="suivi"&&<WithBack label="Suivi des séances" backTo="patient-menu"><SuiviTab initialPatient={selectedPatient}/></WithBack>}
        {screen==="exercices"&&<WithBack label="Exercices à la maison" backTo="patient-menu"><ExercicesTab patientNom={selectedPatient} extracted={extracted}/></WithBack>}
        {screen==="coaching"&&<WithBack label="Coaching" backTo="patient-menu"><CoachingTab patientNom={selectedPatient}/></WithBack>}
        {screen==="settings"&&(
          <div>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <button onClick={()=>goTo("home")} className="btn btn-s" style={{padding:"7px 12px",fontSize:18}}>←</button>
              <div style={{fontSize:17,fontWeight:700}}>⚙️ Paramètres</div>
            </div>
            <div className="card">
              <div className="slabel" style={{color:C.accent}}>🔑 Clé API Anthropic</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:12,lineHeight:1.7}}>
                Votre clé API est stockée localement sur votre appareil et n'est jamais envoyée à d'autres serveurs.
                Obtenez votre clé sur <span style={{color:C.blue}}>console.anthropic.com</span> → API Keys.
              </div>
              <div className="fg" style={{marginBottom:14}}>
                <label>Clé API (sk-ant-...)</label>
                <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-api03-..." style={{fontFamily:"JetBrains Mono",fontSize:13}}/>
              </div>
              <button className="btn btn-p" style={{width:"100%"}} onClick={()=>{saveKey(apiKey);alert("✅ Clé API enregistrée !");}}>💾 Enregistrer la clé</button>
              {apiKey&&<div style={{marginTop:10,fontSize:11,color:C.accent,textAlign:"center"}}>✅ Clé configurée — {apiKey.substring(0,20)}...</div>}
            </div>
            <div className="card">
              <div className="slabel" style={{color:C.blue}}>💡 Comment obtenir une clé API</div>
              <div style={{fontSize:12,color:C.muted,lineHeight:1.9}}>
                <div>1. Allez sur <span style={{color:C.blue}}>console.anthropic.com</span></div>
                <div>2. Créez un compte et ajoutez un moyen de paiement</div>
                <div>3. Menu → API Keys → Create Key</div>
                <div>4. Copiez la clé et collez-la ci-dessus</div>
                <div style={{marginTop:8,color:C.yellow}}>💰 Coût estimé : 2-5€/mois pour un usage quotidien</div>
              </div>
            </div>
          </div>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(KineApp));
</script>
</body>
</html>
